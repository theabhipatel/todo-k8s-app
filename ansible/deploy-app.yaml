---
- name: Deploy Applications
  hosts: k3s_controller
  become: true

  vars_files:
    - secrets.yml

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:

    # --------------------------------------------------
    # ArgoCD Admin Password
    # --------------------------------------------------

    - name: Generate ArgoCD admin password hash
      command: htpasswd -nbBC 10 "" "{{ argocd_admin_password }}"
      register: argocd_password_hash
      changed_when: false

    # --------------------------------------------------
    # ArgoCD
    # --------------------------------------------------

    - name: Install ArgoCD
      command:
        argv:
          - helm
          - upgrade
          - --install
          - argocd
          - argo/argo-cd
          - --namespace
          - argocd
          - --create-namespace
          - --set-string
          - "configs.secret.argocdServerAdminPassword={{ argocd_password_hash.stdout.split(':', 1)[1] }}"
          - --set
          - controller.nodeSelector.node-role=controller
          - --set
          - server.nodeSelector.node-role=controller
          - --set
          - repoServer.nodeSelector.node-role=controller
          - --set
          - applicationSet.nodeSelector.node-role=controller
          - --set
          - redis.nodeSelector.node-role=controller
          - --set
          - dex.nodeSelector.node-role=controller
          - --set
          - notifications.nodeSelector.node-role=controller

          - --set
          - global.tolerations[0].key=node-role.kubernetes.io/control-plane
          - --set
          - global.tolerations[0].operator=Equal
          - --set-string
          - global.tolerations[0].value=true
          - --set
          - global.tolerations[0].effect=NoSchedule
          - --wait
          - --timeout
          - 10m

    # --------------------------------------------------
    # Bootstrap Todo App
    # --------------------------------------------------

    - name: Copy ArgoCD Application manifest
      copy:
        src: ../argocd/todo-app.yaml
        dest: /tmp/todo-app.yaml

    - name: Bootstrap Todo App in ArgoCD
      command: kubectl apply -f /tmp/todo-app.yaml

    # --------------------------------------------------
    # Verify
    # --------------------------------------------------

    - name: Get Kubernetes nodes
      command: kubectl get nodes
      register: nodes
      changed_when: false

    - name: Show Kubernetes nodes
      debug:
        var: nodes.stdout_lines

    - name: Get all pods
      command: kubectl get pods -A
      register: pods
      changed_when: false

    - name: Show all pods
      debug:
        var: pods.stdout_lines