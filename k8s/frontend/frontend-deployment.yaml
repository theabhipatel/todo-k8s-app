apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: itheabhipatel/todo-frontend-live:1579348b7aa08a826de07a415bacac5d15f64f4f
          ports:
            - containerPort: 80